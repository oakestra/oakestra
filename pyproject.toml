[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".github/*",
    "**/proto",
    # Imported from oakestra-net and not yet compliant with this config.
    # TODO(giobart): clean up and remove these two entries.
    "root_orchestrator/service-manager",
    "cluster_orchestrator/service-manager",
]
[tool.ruff.lint]
extend-select = [
    "TD",  # todos
    "I",  # isort
]
ignore = [
    "TD003",  # missing-todo-link. Ignored because we don't require adding tickets to TODOs
]
