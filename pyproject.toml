[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".github/*",
    "**/proto",
    "libraries/resource_abstractor_client/resource_abstractor_client/openapi",
]
[tool.ruff.lint]
extend-select = [
    "TD",  # todos
    "I",  # isort
]
ignore = [
    "TD003",  # missing-todo-link. Ignored because we don't require adding tickets to TODOs
]
