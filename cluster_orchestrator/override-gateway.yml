services:

  # Reset port mappings so that services are only reachable:
  # * from within the docker network
  # * via the gateways

  # One-shot: provision the cluster's certificate material before anything
  # that needs it starts. If the mTLS files are missing it redeems
  # CLUSTER_REGISTRATION_TOKEN against the root's /api/certs/cluster-bootstrap
  # endpoint. It also requires a BYO public gateway cert in /certs/public/
  # (a separate certificate system from the internal mTLS CA) and fails fast
  # if absent.
  cluster_cert_bootstrap:
    image: cluster_manager
    build:
      context: cluster-manager/
      args:
        - LIB_BRANCH=${LIB_BRANCH:-develop}
    container_name: cluster_cert_bootstrap
    entrypoint: ["/bin/sh", "/docker-update-ca-trust.sh"]
    command: ["python", "bootstrap_certificates.py"]
    environment:
      - SYSTEM_MANAGER_URL=${SYSTEM_MANAGER_URL}
      - SYSTEM_MANAGER_PORT=${SYSTEM_MANAGER_GATEWAY_HTTPS_PORT:-443}
      - CLUSTER_NAME=${CLUSTER_NAME}
      - CLUSTER_IP=${CLUSTER_IP}
      - CLUSTER_REGISTRATION_TOKEN=${CLUSTER_REGISTRATION_TOKEN:-}
      - ROOT_GATEWAY_TRUST=${ROOT_GATEWAY_TRUST:-system}
    volumes:
      - ${CLUSTER_CERT_PATH:-./config/certs}:/certs
      - ./config/docker-update-ca-trust.sh:/docker-update-ca-trust.sh:ro
    restart: "no"

  mqtt:
    user: root
    volumes:
      - ${CLUSTER_CERT_PATH:-./config/certs}:/certs:ro
      - ./mosquitto/mosquitto-tls.conf:/mosquitto/config/mosquitto.conf
    ports: !override
      - "8883:8883"
    expose:
      - "8883"
    depends_on:
      cluster_cert_bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -p 8883 --cafile /certs/ca.crt --cert /certs/cluster.crt --key /certs/cluster.key -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6

  mongo_cluster:
    ports: !reset []

  mongo_clusternet:
    ports: !reset []

  cluster_manager:
    entrypoint: ["/bin/sh", "/docker-update-ca-trust.sh"]
    command: ["sh", "-c", "exec gunicorn --bind [::]:$$MY_PORT cluster_manager:app"]
    volumes:
      - ${CLUSTER_CERT_PATH:-./config/certs}:/certs
      - ./config/docker-update-ca-trust.sh:/docker-update-ca-trust.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CLUSTER_REGISTRATION_TOKEN=${CLUSTER_REGISTRATION_TOKEN:-}
      - SYSTEM_MANAGER_PORT=${SYSTEM_MANAGER_GATEWAY_HTTPS_PORT:-443}
      - MQTT_CONTAINER_NAME=${MQTT_CONTAINER_NAME:-mqtt}
      - SYSTEM_MANAGER_GRPC_PORT=${SYSTEM_MANAGER_GATEWAY_HTTPS_PORT:-443}
      - SYSTEM_MANAGER_USE_TLS=true
      - CLUSTER_SERVICE_MANAGER_GATEWAY_PORT=${CLUSTER_GATEWAY_PORT:-8443}
      - CLUSTER_IP=${CLUSTER_IP}
      - CLUSTER_PORT=${CLUSTER_GATEWAY_PORT:-8443}
      - CLUSTER_CERT_FILE=/certs/cluster.crt
      - CLUSTER_KEY_FILE=/certs/cluster.key
      - ROOT_CA_FILE=/certs/ca.crt
      - CLUSTER_CA_CERT_FILE=/certs/cluster_ca.crt
      - CLUSTER_CA_KEY_FILE=/certs/cluster_ca.key
      - ROOT_GATEWAY_TRUST=${ROOT_GATEWAY_TRUST:-system}
      - MQTT_CERT=/certs
      - MQTT_BROKER_PORT=8883
    depends_on:
      cluster_cert_bootstrap:
        condition: service_completed_successfully
    ports: !reset []

  cluster_service_manager:
    entrypoint: ["/bin/sh", "/docker-update-ca-trust.sh"]
    command: ["python", "service_manager.py"]
    volumes:
      - ${CLUSTER_CERT_PATH:-./config/certs}:/certs:ro
      - ./config/docker-update-ca-trust.sh:/docker-update-ca-trust.sh:ro
    environment:
      - ROOT_SERVICE_MANAGER_PORT=${SYSTEM_MANAGER_GATEWAY_HTTPS_PORT:-443}
      - ROOT_SERVICE_MANAGER_USE_TLS=true
      - CLUSTER_IP=${CLUSTER_IP}
      - CLUSTER_CERT_FILE=/certs/cluster.crt
      - CLUSTER_KEY_FILE=/certs/cluster.key
      - ROOT_CA_FILE=/certs/ca.crt
      - ROOT_GATEWAY_TRUST=${ROOT_GATEWAY_TRUST:-system}
      - MQTT_CERT=/certs
      - MQTT_BROKER_PORT=8883
    depends_on:
      cluster_cert_bootstrap:
        condition: service_completed_successfully
    ports: !reset []

  cluster_scheduler:
    ports: !reset []

  cluster_resource_abstractor:
    ports: !reset []

  cluster_redis:
    ports: !reset []

  prometheus:
    ports: !reset []

  cluster_grafana:
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:8888/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ENFORCE_DOMAIN=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_CSRF_TRUSTED_ORIGINS=localhost:8888
      - GF_SECURITY_CSRF_ADDITIONAL_HEADERS=X-Forwarded-Host
    ports: !reset []

  cluster_loki:
    ports: !reset []

  cluster_addons_manager:
    environment:
      - MARKETPLACE_ADDR=http://${SYSTEM_MANAGER_URL}:80
    ports: !reset []

  cluster_addons_dashboard:
    environment:
      - BASE_HREF=cluster-addons-dashboard
    ports: !reset []

  cluster_kong_db_external:
    image: postgres:16
    container_name: cluster_kong_db_external
    hostname: cluster_kong_db_external
    environment:
      - POSTGRES_USER=kong
      - POSTGRES_PASSWORD=kong
      - POSTGRES_DB=kong
    volumes:
      - cluster_kong_db_external_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cluster_kong_db_internal:
    image: postgres:16
    container_name: cluster_kong_db_internal
    hostname: cluster_kong_db_internal
    environment:
      - POSTGRES_USER=kong
      - POSTGRES_PASSWORD=kong
      - POSTGRES_DB=kong
    volumes:
      - cluster_kong_db_internal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cluster_kong_bootstrap_external:
    image: kong:3.6
    container_name: cluster_kong_bootstrap_external
    command: kong migrations bootstrap
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=cluster_kong_db_external
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kong
      - KONG_PG_DATABASE=kong
    depends_on:
      cluster_kong_db_external:
        condition: service_healthy
    restart: on-failure

  cluster_kong_bootstrap_internal:
    image: kong:3.6
    container_name: cluster_kong_bootstrap_internal
    command: kong migrations bootstrap
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=cluster_kong_db_internal
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kong
      - KONG_PG_DATABASE=kong
    depends_on:
      cluster_kong_db_internal:
        condition: service_healthy
    restart: on-failure

  # External gateway
  cluster_kong_external:
    image: kong:3.6
    container_name: cluster_kong_external
    hostname: cluster_kong_external
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=cluster_kong_db_external
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kong
      - KONG_PG_DATABASE=kong
      - KONG_PROXY_LISTEN=0.0.0.0:8000 http2, 0.0.0.0:8443 ssl http2
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_SSL_CERT=/certs/public/fullchain.pem
      - KONG_SSL_CERT_KEY=/certs/public/privkey.pem
      - KONG_NGINX_PROXY_SSL_CLIENT_CERTIFICATE=/certs/ca.crt
      - KONG_NGINX_PROXY_SSL_VERIFY_CLIENT=optional
      - KONG_NGINX_PROXY_SSL_VERIFY_DEPTH=2
      - KONG_LOG_LEVEL=info
    volumes:
      - ${CLUSTER_CERT_PATH:-./config/certs}:/certs:ro
    ports:
      - "8080:8000"
      - "8443:8443"
    expose:
      - "8001"
    depends_on:
      cluster_kong_db_external:
        condition: service_healthy
      cluster_kong_bootstrap_external:
        condition: service_completed_successfully
      cluster_cert_bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Internal gateway
  cluster_kong_internal:
    image: kong:3.6
    container_name: cluster_kong_internal
    hostname: cluster_kong_internal
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=cluster_kong_db_internal
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kong
      - KONG_PG_DATABASE=kong
      - KONG_PROXY_LISTEN=0.0.0.0:8000 http2
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_LOG_LEVEL=info
    ports:
      - "127.0.0.1:8888:8000"
    expose:
      - "8001"
    depends_on:
      cluster_kong_db_internal:
        condition: service_healthy
      cluster_kong_bootstrap_internal:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Initial config
  cluster_kong_init:
    image: kong/deck:v1.56.0
    container_name: cluster_kong_init
    volumes:
      - ./config/kong/init-gateway.sh:/init-gateway.sh:ro
      - ./config/kong/external.yaml:/external.yaml:ro
      - ./config/kong/internal.yaml:/internal.yaml:ro
    entrypoint: ["sh", "/init-gateway.sh"]
    depends_on:
      cluster_kong_external:
        condition: service_healthy
      cluster_kong_internal:
        condition: service_healthy
    restart: on-failure

volumes:
  cluster_kong_db_external_data:
    driver: local
  cluster_kong_db_internal_data:
    driver: local