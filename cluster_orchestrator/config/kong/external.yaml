_format_version: "3.0"

# The external gateway terminates TLS with a *publicly trusted* server cert
# (/certs/public/, BYO) and verifies client certificates against the internal
# root CA only *optionally* (KONG_NGINX_PROXY_SSL_VERIFY_CLIENT=optional,
# depth 2 for worker chains).
#
# Routes are grouped into two sections:
#   * mTLS Routes  — machine-to-machine (root -> cluster, worker -> cluster).
#                    Each carries a pre-function guard that identifies the
#                    caller by its verified client certificate and admits one
#                    role only: &root_guard or &worker_guard (see below). Both
#                    reject requests on the cleartext :8080 listener
#                    (ssl_client_verify is empty there) and pass the
#                    certificate on in X-Client-Cert; cluster_manager then
#                    checks a worker acts for itself and belongs to this cluster.
#   * Public Routes — read-only status/docs, the CA download, the token-gated
#                     worker bootstrap, and explicitly blocked endpoints.
#
# Caller identity. Client certs are verified against the root CA with depth 2, so
# the root, every cluster and every cluster's workers all have a valid chain: the
# chain alone says nothing about who the caller is. Every cert carries exactly
# one SPIFFE ID in a URI SAN, set by its issuer, and every CA subject carries an
# OU marker the root chose:
#   spiffe://oakestra/root                          issued by the root CA
#   spiffe://oakestra/cluster/<id>                  issued by the root CA
#   spiffe://oakestra/cluster/<id>/worker/<id>      issued by a cluster CA
# A cluster holds its intermediate's key and can put any SPIFFE ID in certs it
# signs, so an ID only counts when the issuer marker matches it. The &identify
# chunk extracts both into kong.ctx.shared.caller; the role chunk checks them.
# Which cluster issued a worker cert is checked by cluster_manager, which knows
# its own intermediate. Lua modules a pre-function may load are listed in
# KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES (override-gateway.yml).
#
# Callers: the root (system_manager, root_service_manager, with server.crt) calls
# /api/service, /api/certs/worker-token and /api/net/job/update; workers
# (NodeEngine) call /api/node/register and /api/certs/worker-renew. The cluster
# scheduler's /api/result/deploy and cluster_manager's /api/net/deployment calls
# stay inside the cluster and are not exposed.

services:
  # ======================================================================
  # mTLS Routes (client certificate required)
  # ======================================================================

  # Cluster-manager machine-to-machine surface.
  - name: cluster_manager_m2m
    url: http://cluster_manager:10100
    routes:
      # Worker registration (worker presents its bootstrapped cert).
      - name: cm-node-register
        protocols: [https]
        paths:
          - /api/node/register
        methods: [POST, OPTIONS]
        strip_path: false
        plugins:
          - &worker_guard
            name: pre-function
            config:
              access:
                - &identify |
                  if ngx.var.ssl_client_verify ~= "SUCCESS" then
                    return kong.response.exit(401, { message = "mTLS client certificate required" })
                  end
                  local crt = require("resty.openssl.x509").new(ngx.var.ssl_client_raw_cert)
                  local uris = {}
                  local san = crt:get_subject_alt_name()
                  if san then
                    for kind, value in san:each() do
                      if kind == "URI" then uris[#uris + 1] = value end
                    end
                  end
                  local issuer
                  for kind, attribute in crt:get_issuer_name():each() do
                    if kind == "OU" and attribute.blob == "oakestra-root-ca" then issuer = "root" end
                    if kind == "OU" and attribute.blob == "oakestra-cluster-ca" then issuer = "cluster" end
                  end
                  kong.ctx.shared.caller = { id = #uris == 1 and uris[1] or "", issuer = issuer }
                  kong.service.request.set_header("X-Client-Cert", ngx.var.ssl_client_escaped_cert)
                - |
                  local caller = kong.ctx.shared.caller
                  if caller.issuer ~= "cluster"
                    or not caller.id:match("^spiffe://oakestra/cluster/[0-9a-f]+/worker/[0-9a-f]+$") then
                    return kong.response.exit(403, { message = "caller not permitted on this route" })
                  end

      # Worker certificate renewal. cluster_manager binds the new cert to the presented one.
      - name: cm-worker-renew
        protocols: [https]
        paths:
          - /api/certs/worker-renew
        methods: [POST, OPTIONS]
        strip_path: false
        plugins:
          - *worker_guard

      # Deploy/undeploy commands from the root.
      - name: cm-service-instance
        protocols: [https]
        paths:
          - /api/service/
        methods: [POST, DELETE, OPTIONS]
        strip_path: false
        plugins:
          - &root_guard
            name: pre-function
            config:
              access:
                - *identify
                - |
                  local caller = kong.ctx.shared.caller
                  if caller.issuer ~= "root" or caller.id ~= "spiffe://oakestra/root" then
                    return kong.response.exit(403, { message = "caller not permitted on this route" })
                  end

      # One-time worker token hashes pushed by the root.
      - name: cm-worker-token
        protocols: [https]
        paths:
          - /api/certs/worker-token
        methods: [POST, OPTIONS]
        strip_path: false
        plugins:
          - *root_guard

  # Cluster service manager machine-to-machine surface (root_service_manager).
  - name: cluster_service_manager_m2m
    url: http://cluster_service_manager:10110
    routes:
      - name: csm-job-update
        protocols: [https]
        paths:
          - /api/net/job/update
        methods: [POST, OPTIONS]
        strip_path: false
        plugins:
          - *root_guard

  # ======================================================================
  # Public Routes (no client certificate)
  # ======================================================================

  # Cluster-manager public surface (read-only + token-gated bootstrap).
  # X-Client-Cert is only ever set by the gateway after verifying a client cert,
  # so a client-supplied one is dropped.
  - name: cluster_manager_public
    url: http://cluster_manager:10100
    plugins:
      - name: pre-function
        config:
          access:
            - |
              kong.service.request.clear_header("X-Client-Cert")
    routes:
      - name: cm-cluster-status
        paths:
          - /api/cluster/status
        methods: [GET, OPTIONS]
        strip_path: false

      # Token-gated worker certificate bootstrap (no client cert — the
      # one-time token is the credential). https-only so tokens never
      # traverse the cleartext listener.
      - name: cm-worker-bootstrap
        protocols: [https]
        paths:
          - /api/certs/worker-bootstrap
        methods: [POST, OPTIONS]
        strip_path: false

      - name: cm-docs-public
        paths:
          - /api/docs
          - /docs
          - /docs/
          - /docs/openapi.json
        methods: [GET, OPTIONS]
        strip_path: false

      # Root CA download — workers bootstrap trust from here.
      - name: cm-ca-cert-public
        paths:
          - /api/certs/ca.crt
        methods: [GET, OPTIONS]
        strip_path: false

  # Fallback deny: any API path not matched by explicit allowlist stays blocked.
  # (cluster_manager has no user-level auth of its own, so everything exposed
  # above is either mTLS-guarded, token-gated, or read-only.)
  - name: cluster_manager_api_block
    url: http://cluster_manager:10100
    routes:
      - name: cm-block-api-fallback
        paths:
          - /api
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Endpoint not exposed on the external cluster gateway"

  # Explicitly block addons manager service on the external gateway.
  - name: cluster_addons_manager_block
    url: http://cluster_addons_manager:11201
    routes:
      - name: cm-block-addons-manager
        paths:
          - /api/v1/addons
          - /api/v1/addons/
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Addons manager is not exposed on the external cluster gateway"

  # Explicitly block addons dashboard service on the external gateway.
  - name: cluster_addons_dashboard_block
    url: http://cluster_addons_dashboard:11203
    routes:
      - name: cm-block-addons-dashboard
        paths:
          - /cluster-addons-dashboard
          - /cluster-addons-dashboard/
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Addons dashboard is not exposed on the external cluster gateway"

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      exposed_headers:
        - Authorization
      credentials: false
      max_age: 3600
