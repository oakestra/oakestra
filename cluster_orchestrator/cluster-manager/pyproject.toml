[project]
name = "cluster-manager"
version = "0.0.0"
dependencies = [
    "apscheduler>=3.11.3",
    "cryptography==50.0.1",
    "eventlet~=0.41.2",
    "flask~=3.1.3",
    "flask-cors~=6.0.5",
    "flask-pymongo~=3.0.1",
    "flask-smorest==0.47.0",
    "flask-socketio~=5.6.1",
    "flask-swagger-ui~=5.33.0",
    "grpcio~=1.75.1",
    "grpcio-tools~=1.75.1",
    "gunicorn==26.2.0",
    "marshmallow~=4.3.1",
    "paho-mqtt==1.6.1",
    "prometheus-client>=0.25.0",
    "protobuf>=4.25.2,<7.0.0",
    "pyyaml>=6.0.3",
    "requests~=2.27.1",
    "werkzeug~=3.1.9",
    "typing-extensions>=4.16.0",
    "pydantic>=2.13.4",
    "oakestra-logging",
    "oakestra-utils",
    "resource-abstractor-client",
]

[tool.uv.sources]
oakestra-logging = { workspace = true }
oakestra-utils = { workspace = true }
resource-abstractor-client = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"