
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-cluster-log-labels: &cluster-log-labels
  oakestra.logging.collector: cluster
  oakestra.cluster.id: ${CLUSTER_NAME}
  logging_jobname: containerlogs

services:

  # MQTT 
  mqtt:
    image: eclipse-mosquitto:2.0
    hostname: mqtt
    container_name: mqtt
    labels: *cluster-log-labels
    expose:
      - "10003"
    ports:
      - "10003:10003"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - /mosquitto/data
      - /mosquitto/log
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -p 10003 -t '$$SYS/#' -C 1 -W 3 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 6

      
  # cluster-level mongoDB
  mongo_cluster:
    image: mongo:8.0
    container_name: cluster_mongo
    hostname: cluster_mongo
    labels: *cluster-log-labels
    ports:
      - "10107:10107"
    volumes:
      - 'mongodb_cluster_data:/data/db'
    command: mongod --port 10107

  # cluster-level mongoDB
  mongo_clusternet:
    image: mongo:8.0
    container_name: cluster_mongo_net
    hostname: cluster_mongo_net
    labels: *cluster-log-labels
    ports:
      - "10108:10108"
    volumes:
      - 'mongodb_cluster_net_data:/data/db'
    command: mongod --port 10108


  # Cluster Manager
  cluster_service_manager:
    image: ghcr.io/oakestra/oakestra-net/cluster-service-manager:latest
    container_name: cluster_service_manager
    labels: *cluster-log-labels
    hostname: cluster_service_manager
    expose:
      - "10110"
    ports:
      - "10110:10110"
    environment:
      - MY_PORT=10110
      - MQTT_BROKER_PORT=10003
      - MQTT_BROKER_URL=mqtt
      - ROOT_SERVICE_MANAGER_URL=${SYSTEM_MANAGER_URL}
      - ROOT_SERVICE_MANAGER_PORT=10099
      - SYSTEM_MANAGER_URL=cluster_manager
      - SYSTEM_MANAGER_PORT=10000
      - CLUSTER_MONGO_URL=cluster_mongo_net
      - CLUSTER_MONGO_PORT=10108
      - CLUSTER_ADDRESS=${CLUSTER_ADDRESS}
      - CLUSTER_NAME=${CLUSTER_NAME}
    depends_on:
      - mongo_clusternet
      - mqtt
    logging: *default-logging

  # Cluster Manager
  cluster_manager:
    image: cluster_manager
    build:
      context: cluster-manager/
      additional_contexts:
        # Oakestra shared libraries are built from the repo-local libraries/ folder.
        - libraries=../libraries
    container_name: cluster_manager
    labels: *cluster-log-labels
    hostname: cluster_manager
    expose:
      - "10100"
      - "10101"
    ports:
      - "10100:10100"
      - "10101:10101"
    environment:
      - OAKESTRA_SERVICE_NAME=cluster_manager
      - MY_PORT=10100
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SYSTEM_MANAGER_URL=${SYSTEM_MANAGER_URL}
      - SYSTEM_MANAGER_PORT=10000
      - CLUSTER_SERVICE_MANAGER_ADDR=cluster_service_manager
      - CLUSTER_SERVICE_MANAGER_PORT=10110
      - CLUSTER_MONGO_URL=cluster_mongo
      - CLUSTER_MONGO_PORT=10107
      - CLUSTER_SCHEDULER_URL=cluster_scheduler
      - CLUSTER_SCHEDULER_PORT=10105
      - MQTT_BROKER_URL=mqtt
      - MQTT_BROKER_PORT=10003
      - RESOURCE_ABSTRACTOR_URL=cluster_resource_abstractor
      - RESOURCE_ABSTRACTOR_PORT=11012
      - CLUSTER_NAME=${CLUSTER_NAME}
      - CLUSTER_LOCATION=${CLUSTER_LOCATION}
      - CLUSTER_ADDRESS=${CLUSTER_ADDRESS}
      - AGGREGATION_INTERVAL=${AGGREGATION_INTERVAL:-15}
      - NODE_SCHEDULED_TIMEOUT=${NODE_SCHEDULED_TIMEOUT:-15}
    depends_on:
      - mongo_cluster
      - mqtt
      - cluster_scheduler
      - cluster_service_manager
    logging: *default-logging

  # Cluster Scheduler
  cluster_scheduler:
    image: cluster_scheduler
    build: ../scheduler/
    container_name: cluster_scheduler
    labels: *cluster-log-labels
    hostname: cluster_scheduler
    expose:
      - "10105"
    ports:
      - "10105:10105"
    environment:
      - ORCHESTRATION_PLANE=cluster
      - API_PORT=10105
      - MANAGER_URL=cluster_manager
      - MANAGER_PORT=10100
      - RESOURCE_ABSTRACTOR_URL=cluster_resource_abstractor
      - RESOURCE_ABSTRACTOR_PORT=11012
      - REDIS_ADDR=redis://:clusterRedis@cluster_redis:6479
    depends_on:
      - cluster_redis
      - cluster_resource_abstractor
    logging: *default-logging

  cluster_resource_abstractor:
    image: resource_abstractor
    build:
      context: ../resource-abstractor/
      additional_contexts:
        - libraries=../libraries
    container_name: cluster_resource_abstractor
    labels: *cluster-log-labels
    hostname: cluster_resource_abstractor
    expose:
      - "11012"
    ports:
      - "11012:11012"
    environment:
      - OAKESTRA_SERVICE_NAME=cluster_resource_abstractor
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RESOURCE_ABSTRACTOR_PORT=11012
      - MONGO_URL=cluster_mongo
      - MONGO_PORT=10107
    depends_on:
      - mongo_cluster
    logging: *default-logging


  # Redis for the Cluster Scheduler as Job Queue
  cluster_redis:
    image: redis
    hostname: cluster_redis
    container_name: cluster_redis
    labels: *cluster-log-labels
    ports:
      - "6479:6479"
    command: redis-server --requirepass clusterRedis --port 6479


  prometheus:
    image: prom/prometheus
    container_name: prometheus
    hostname: prometheus
    labels: *cluster-log-labels
    ports:
      - 10009:9090
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - cluster_manager


  # Observability stack (Grafana, Loki, Alloy)
  cluster_grafana:
    image: grafana/grafana
    hostname: cluster_grafana
    container_name: cluster_grafana
    labels: *cluster-log-labels
    ports:
      - 3001:3000
    environment:
      - OAKESTRA_ALERT_WEBHOOK_URL=${OAKESTRA_ALERT_WEBHOOK_URL:-http://127.0.0.1:65535/oakestra-alerts}
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./config/alerts/grafana-rules.yml:/etc/grafana/provisioning/alerting/oakestra-rules.yml:ro
      - ./config/alerts/grafana-contact-point.yml:/etc/grafana/provisioning/alerting/oakestra-contact-point.yml:ro
      - ./config/dashboards:/var/lib/grafana/dashboards
    logging: *default-logging

  cluster_loki:
    container_name: cluster_loki
    image: grafana/loki:2.9.2
    labels: *cluster-log-labels
    ports:
      - 127.0.0.1:3101:3101
    volumes:
      - ./config/loki.yml:/etc/loki/config.yml
      - cluster_loki_data:/tmp

    command: -config.file=/etc/loki/config.yml
    logging: *default-logging
  cluster_alloy:
    image: grafana/alloy:v1.17.0
    container_name: cluster_alloy
    labels: *cluster-log-labels
    ports:
      - 127.0.0.1:12346:12345
    environment:
      - ALLOY_COLLECTOR_ID=cluster
      - LOKI_URL=http://cluster_loki:3101/loki/api/v1/push
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cluster_alloy_data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - cluster_loki
    logging: *default-logging

    # Addons
  cluster_addons_manager:
    image: addons_manager
    container_name: cluster_addons_manager
    build:
      context: ../addons_engine/addons-manager/
      additional_contexts:
        - libraries=../libraries
    labels: *cluster-log-labels
    environment:
      - OAKESTRA_SERVICE_NAME=cluster_addons_manager
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADDONS_MANAGER_PORT=11201
      - ADDONS_ENGINE_MONGO_URL=cluster_mongo
      - ADDONS_ENGINE_MONGO_PORT=10107
      - MARKETPLACE_ADDR=http://${SYSTEM_MANAGER_URL}:11102
    ports:
      - 11201:11201
    depends_on:
      - mongo_cluster
    logging: *default-logging

  cluster_addons_monitor:
    image: addons_monitor
    container_name: cluster_addons_monitor
    build:
      context: ../addons_engine/addons-monitor/
      additional_contexts:
        - libraries=../libraries
    labels: *cluster-log-labels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OAKESTRA_SERVICE_NAME=cluster_addons_monitor
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADDONS_MANAGER_ADDR=http://cluster_addons_manager:11201
      - ORCHESTRATION_PLANE=cluster
      - DEFAULT_PROJECT_NAME=cluster_orchestrator
    depends_on:
      - cluster_addons_manager
    logging: *default-logging

  
  cluster_addons_dashboard:
    image: addons_dashboard
    container_name: cluster_addons_dashboard
    build: ../addons_engine/addons-dashboard/
    labels: *cluster-log-labels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DASHBOARD_PORT=11203
      - MARKETPLACE_URL=${SYSTEM_MANAGER_URL}
      - RESOURCE_ABSTRACTOR_URL=cluster_resource_abstractor
      - ADDONS_ENGINE_URL=cluster_addons_manager
    depends_on:
      - cluster_addons_monitor
      - cluster_addons_manager
    ports:
      - 11203:11203
    expose:
      - "11203"
    logging: *default-logging

volumes:
  mongodb_cluster_data:
    driver: local
  mongodb_cluster_net_data:
    driver: local
  cluster_alloy_data:
    driver: local
  cluster_loki_data:
    driver: local

networks:
  default:
    name: oakestra
