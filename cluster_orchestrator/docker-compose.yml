
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-cluster-log-labels: &cluster-log-labels
  oakestra.logging.collector: cluster
  oakestra.cluster.id: ${CLUSTER_NAME}
  logging_jobname: containerlogs

services:

  # MQTT 
  mqtt:
    image: eclipse-mosquitto:2.0
    hostname: mqtt
    container_name: mqtt
    labels: *cluster-log-labels
    expose:
      - "10003"
    ports:
      - "10003:10003"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - /mosquitto/data
      - /mosquitto/log
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -p 10003 -t '$$SYS/#' -C 1 -W 3 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 6

      
  # cluster-level mongoDB
  mongo_cluster:
    image: mongo:8.0
    container_name: cluster_mongo
    hostname: cluster_mongo
    labels: *cluster-log-labels
    ports:
      - "10107:10107"
    volumes:
      - 'mongodb_cluster_data:/data/db'
    command: mongod --port 10107

  # cluster-level mongoDB
  mongo_clusternet:
    image: mongo:8.0
    container_name: cluster_mongo_net
    hostname: cluster_mongo_net
    labels: *cluster-log-labels
    ports:
      - "10108:10108"
    volumes:
      - 'mongodb_cluster_net_data:/data/db'
    command: mongod --port 10108


  # Cluster Manager
  cluster_service_manager:
    image: ghcr.io/oakestra/oakestra-net/cluster-service-manager:latest
    container_name: cluster_service_manager
    labels: *cluster-log-labels
    hostname: cluster_service_manager
    expose:
      - "10110"
    ports:
      - "10110:10110"
    environment:
      - MY_PORT=10110
      - MQTT_BROKER_PORT=10003
      - MQTT_BROKER_URL=mqtt
      - ROOT_SERVICE_MANAGER_URL=${SYSTEM_MANAGER_URL}
      - ROOT_SERVICE_MANAGER_PORT=10099
      - SYSTEM_MANAGER_URL=cluster_manager
      - SYSTEM_MANAGER_PORT=10000
      - CLUSTER_MONGO_URL=cluster_mongo_net
      - CLUSTER_MONGO_PORT=10108
      - CLUSTER_ADDRESS=${CLUSTER_ADDRESS}
      - CLUSTER_NAME=${CLUSTER_NAME}
    depends_on:
      - mongo_clusternet
      - mqtt
    logging: *default-logging

  # Cluster Manager
  cluster_manager:
    image: cluster_manager
    build:
      context: cluster-manager/
      additional_contexts:
        # Oakestra shared libraries are built from the repo-local libraries/ folder.
        - libraries=../libraries
    container_name: cluster_manager
    labels: *cluster-log-labels
    hostname: cluster_manager
    expose:
      - "10100"
      - "10101"
    ports:
      - "10100:10100"
      - "10101:10101"
    environment:
      - OAKESTRA_SERVICE_NAME=cluster_manager
      - MY_PORT=10100
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SYSTEM_MANAGER_URL=${SYSTEM_MANAGER_URL}
      - SYSTEM_MANAGER_PORT=10000
      - CLUSTER_SERVICE_MANAGER_ADDR=cluster_service_manager
      - CLUSTER_SERVICE_MANAGER_PORT=10110
      - CLUSTER_MONGO_URL=cluster_mongo
      - CLUSTER_MONGO_PORT=10107
      - CLUSTER_SCHEDULER_URL=cluster_scheduler
      - CLUSTER_SCHEDULER_PORT=10105
      - MQTT_BROKER_URL=mqtt
      - MQTT_BROKER_PORT=10003
      - RESOURCE_ABSTRACTOR_URL=cluster_resource_abstractor
      - RESOURCE_ABSTRACTOR_PORT=11012
      - CLUSTER_NAME=${CLUSTER_NAME}
      - CLUSTER_LOCATION=${CLUSTER_LOCATION}
      - CLUSTER_ADDRESS=${CLUSTER_ADDRESS}
      - AGGREGATION_INTERVAL=${AGGREGATION_INTERVAL:-15}
      - NODE_SCHEDULED_TIMEOUT=${NODE_SCHEDULED_TIMEOUT:-15}
    depends_on:
      - mongo_cluster
      - mqtt
      - cluster_scheduler
      - cluster_service_manager
    logging: *default-logging

  # Cluster Scheduler
  cluster_scheduler:
    image: cluster_scheduler
    build: ../scheduler/
    container_name: cluster_scheduler
    labels: *cluster-log-labels
    hostname: cluster_scheduler
    expose:
      - "10105"
    ports:
      - "10105:10105"
    environment:
      - ORCHESTRATION_PLANE=cluster
      - API_PORT=10105
      - MANAGER_URL=cluster_manager
      - MANAGER_PORT=10100
      - RESOURCE_ABSTRACTOR_URL=cluster_resource_abstractor
      - RESOURCE_ABSTRACTOR_PORT=11012
      - REDIS_ADDR=redis://:clusterRedis@cluster_redis:6479
    depends_on:
      - cluster_redis
      - cluster_resource_abstractor
    logging: *default-logging

  cluster_resource_abstractor:
    image: resource_abstractor
    build:
      context: ../resource-abstractor/
      additional_contexts:
        - libraries=../libraries
    container_name: cluster_resource_abstractor
    labels: *cluster-log-labels
    hostname: cluster_resource_abstractor
    expose:
      - "11012"
    ports:
      - "11012:11012"
    environment:
      - OAKESTRA_SERVICE_NAME=cluster_resource_abstractor
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RESOURCE_ABSTRACTOR_PORT=11012
      - MONGO_URL=cluster_mongo
      - MONGO_PORT=10107
    depends_on:
      - mongo_cluster
    logging: *default-logging


  # Redis for the Cluster Scheduler as Job Queue
  cluster_redis:
    image: redis
    hostname: cluster_redis
    container_name: cluster_redis
    labels: *cluster-log-labels
    ports:
      - "6479:6479"
    command: redis-server --requirepass clusterRedis --port 6479


  prometheus:
    image: prom/prometheus:v3.13.2-distroless
    container_name: cluster_prometheus
    hostname: cluster_prometheus
    labels: *cluster-log-labels
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cluster_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    depends_on:
      - cluster_manager
      - node_exporter
      - cadvisor
    extra_hosts:
      - host.metrics.internal=${CLUSTER_METRICS_GATEWAY:-172.30.251.1}
    networks:
      - default
      - metrics
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: cluster_node_exporter
    hostname: cluster_node_exporter
    labels: *cluster-log-labels
    network_mode: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
      - --web.listen-address=${CLUSTER_METRICS_GATEWAY:-172.30.251.1}:9100
      - --web.max-requests=5
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cluster_cadvisor
    hostname: cluster_cadvisor
    labels: *cluster-log-labels
    ports:
      - "127.0.0.1:8082:8080"
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,oakestra.cluster.id,oakestra.logging.collector
      - --enable_metrics=cpu,disk,diskIO,memory,network
      - --housekeeping_interval=10s
      - --max_housekeeping_interval=15s
      - --storage_duration=1m
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /sys
        target: /sys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CONTAINERD_SOCKET:-/run/containerd/containerd.sock}
        target: ${CONTAINERD_SOCKET:-/run/containerd/containerd.sock}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCKER_ROOT_DIR:-/var/lib/docker}
        target: ${DOCKER_ROOT_DIR:-/var/lib/docker}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging


  # Observability stack (Grafana, Loki, Alloy)
  cluster_grafana:
    image: grafana/grafana
    hostname: cluster_grafana
    container_name: cluster_grafana
    labels: *cluster-log-labels
    ports:
      - 3001:3000
    environment:
      - PROMETHEUS_URL=http://cluster_prometheus:9090
      - OAKESTRA_ALERT_CONTACT_POINT=${OAKESTRA_ALERT_CONTACT_POINT:-Oakestra Alert Webhook}
      - OAKESTRA_ALERT_WEBHOOK_URL=${OAKESTRA_ALERT_WEBHOOK_URL:-http://127.0.0.1:65535/oakestra-alerts}
      - OAKESTRA_ALERT_EMAIL_TO=${OAKESTRA_ALERT_EMAIL_TO:-alerts@example.invalid}
      - GF_SMTP_ENABLED=${OAKESTRA_ALERT_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${OAKESTRA_ALERT_SMTP_HOST:-localhost:25}
      - GF_SMTP_USER=${OAKESTRA_ALERT_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${OAKESTRA_ALERT_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${OAKESTRA_ALERT_SMTP_FROM_ADDRESS:-oakestra-alerts@example.invalid}
      - GF_SMTP_FROM_NAME=${OAKESTRA_ALERT_SMTP_FROM_NAME:-Oakestra Alerts}
      - GF_SMTP_SKIP_VERIFY=${OAKESTRA_ALERT_SMTP_SKIP_VERIFY:-false}
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./config/alerts/grafana-rules.yml:/etc/grafana/provisioning/alerting/oakestra-rules.yml:ro
      - ./config/alerts/grafana-contact-point.yml:/etc/grafana/provisioning/alerting/oakestra-contact-point.yml:ro
      - ./config/dashboards:/var/lib/grafana/dashboards
    logging: *default-logging

  cluster_loki:
    container_name: cluster_loki
    image: grafana/loki:2.9.2
    labels: *cluster-log-labels
    ports:
      - 127.0.0.1:3101:3101
    volumes:
      - ./config/loki.yml:/etc/loki/config.yml
      - cluster_loki_data:/tmp

    command: -config.file=/etc/loki/config.yml
    logging: *default-logging
  cluster_alloy:
    image: grafana/alloy:v1.17.0
    container_name: cluster_alloy
    labels: *cluster-log-labels
    ports:
      - 127.0.0.1:12346:12345
    environment:
      - ALLOY_COLLECTOR_ID=cluster
      - LOKI_URL=http://cluster_loki:3101/loki/api/v1/push
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cluster_alloy_data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - cluster_loki
    logging: *default-logging

    # Addons
  cluster_addons_manager:
    image: addons_manager
    container_name: cluster_addons_manager
    build:
      context: ../addons_engine/addons-manager/
      additional_contexts:
        - libraries=../libraries
    labels: *cluster-log-labels
    environment:
      - OAKESTRA_SERVICE_NAME=cluster_addons_manager
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADDONS_MANAGER_PORT=11201
      - ADDONS_ENGINE_MONGO_URL=cluster_mongo
      - ADDONS_ENGINE_MONGO_PORT=10107
      - MARKETPLACE_ADDR=http://${SYSTEM_MANAGER_URL}:11102
    ports:
      - 11201:11201
    depends_on:
      - mongo_cluster
    logging: *default-logging

  cluster_addons_monitor:
    image: addons_monitor
    container_name: cluster_addons_monitor
    build:
      context: ../addons_engine/addons-monitor/
      additional_contexts:
        - libraries=../libraries
    labels: *cluster-log-labels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OAKESTRA_SERVICE_NAME=cluster_addons_monitor
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADDONS_MANAGER_ADDR=http://cluster_addons_manager:11201
      - ORCHESTRATION_PLANE=cluster
      - DEFAULT_PROJECT_NAME=cluster_orchestrator
    depends_on:
      - cluster_addons_manager
    logging: *default-logging

  
  cluster_addons_dashboard:
    image: addons_dashboard
    container_name: cluster_addons_dashboard
    build: ../addons_engine/addons-dashboard/
    labels: *cluster-log-labels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DASHBOARD_PORT=11203
      - MARKETPLACE_URL=${SYSTEM_MANAGER_URL}
      - RESOURCE_ABSTRACTOR_URL=cluster_resource_abstractor
      - ADDONS_ENGINE_URL=cluster_addons_manager
    depends_on:
      - cluster_addons_monitor
      - cluster_addons_manager
    ports:
      - 11203:11203
    expose:
      - "11203"
    logging: *default-logging

volumes:
  mongodb_cluster_data:
    driver: local
  mongodb_cluster_net_data:
    driver: local
  cluster_alloy_data:
    driver: local
  cluster_loki_data:
    driver: local
  cluster_prometheus_data:
    driver: local

networks:
  default:
    name: oakestra
  metrics:
    internal: true
    ipam:
      config:
        - subnet: ${CLUSTER_METRICS_SUBNET:-172.30.251.0/24}
          gateway: ${CLUSTER_METRICS_GATEWAY:-172.30.251.1}
