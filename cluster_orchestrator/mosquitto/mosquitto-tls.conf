user root
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 8883
allow_anonymous false

cafile /certs/ca.crt
# Issued by the cluster intermediate CA (bootstrap_certificates.py), not the root-issued
# cluster.crt, so cluster renewals and root CA rotations do not change it.
certfile /certs/mqtt_server.crt
keyfile /certs/mqtt_server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
crlfile /certs/cluster_revoked.crl
