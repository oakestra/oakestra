[project]
name = "system-manager"
version = "0.0.0"
dependencies = [
    "flask~=3.1.3",
    "marshmallow~=4.3.1",
    "flask-smorest==0.47.0",
    "flask-pymongo~=3.0.1",
    "flask-socketio~=5.6.1",
    "eventlet~=0.41.2",
    "requests~=2.27.1",
    "jsonschema~=4.26.0",
    "flask-cors~=6.0.5",
    "flask-jwt-extended~=4.7.4",
    "flask-restful==0.3.10",
    "pymongo~=4.18.2",
    "werkzeug~=3.1.9",
    "markupsafe~=3.0.3",
    "flask-swagger-ui~=5.33.0",
    "mongomock==4.3.0",
    "cryptography==50.0.1",
    "grpcio~=1.75.1",
    "grpcio-tools~=1.75.1",
    "gunicorn==26.2.0",
    "protobuf>=4.25.2,<7.0.0",
    "oakestra-logging",
    "oakestra-utils",
    "resource-abstractor-client",
]

[tool.uv.sources]
oakestra-logging = { workspace = true }
oakestra-utils = { workspace = true }
resource-abstractor-client = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"