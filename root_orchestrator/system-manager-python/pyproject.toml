[project]
name = "system-manager"
version = "0.0.0"
dependencies = [
    "flask~=2.1.1",
    "marshmallow~=3.15.0",
    "flask-smorest==0.39.0",
    "flask-pymongo==2.3.0",
    "flask-socketio==4.3.1",
    "eventlet==0.33.3",
    "pyyaml>=6.0.3",
    "requests>=2.27.1",
    "cerberus==1.3.5",
    "prometheus-client>=0.25.0",
    "jsonschema~=4.4.0",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-restful>=0.3.10",
    "pymongo~=4.10.1",
    "werkzeug==2.0.3",
    "markupsafe~=2.1.1",
    "flask-swagger-ui>=5.32.8",
    "mongomock>=4.3.0",
    "cryptography==44.0.1",
    "grpcio~=1.75.1",
    "grpcio-tools~=1.75.1",
    "gunicorn==22.0.0",
    "protobuf>=4.25.2,<7.0.0",
    "oakestra-utils",
    "resource-abstractor-client",
]

[tool.uv.sources]
oakestra-utils = { workspace = true }
resource-abstractor-client = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"