# With host networking, mongo, mongo_net, redis and the resource abstractor listen directly on the
# host, where anything on the host network and addon containers (via the Docker gateway) can reach
# them. The base file keeps them off the host; in host mode that protection is gone.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

services:

  # System Manager REST API of Root Orchestrator
  system_manager:
    network_mode: host
    environment:
      - ROOT_MONGO_URL=0.0.0.0
      - ROOT_SCHEDULER_URL=0.0.0.0
      - RESOURCE_ABSTRACTOR_URL=0.0.0.0
      - NET_PLUGIN_URL=0.0.0.0
      - JWT_GENERATOR_URL=0.0.0.0
    logging: *default-logging

  # MongoDB in Root Orchestrator
  mongo_root:
    network_mode: host

  # cluster-level mongoDB
  mongo_rootnet:
    network_mode: host

  # Cluster Manager
  root_service_manager:
    network_mode: host
    environment:
      - SYSTEM_MANAGER_URL=0.0.0.0
      - ROOT_MONGO_URL=0.0.0.0
      - JWT_GENERATOR_URL=0.0.0.0

  # Redis for the Root Scheduler
  root_redis:
    network_mode: host

  # Observability Stack
  grafana:
    network_mode: host

  loki:
    network_mode: host
    #logging:
    #  driver: none

  alloy:
    network_mode: host
    environment:
      - LOKI_URL=http://127.0.0.1:3100/loki/api/v1/push
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy

  dashboard:
    network_mode: host
    # network_mode and networks are mutually exclusive, so drop the addon UI network that the
    # base file attaches.
    networks: !reset null
    environment:
      - ADDONS_MANAGER_ADDRESS=127.0.0.1:11101
      - MARKETPLACE_ADDRESS=127.0.0.1:11102
      # No Docker DNS in host mode, so addonui-<name> can't be resolved and addon UIs won't
      # load. The addon manager pages still work.

  # Root Scheduler
  root_scheduler:
    network_mode: host
    environment:
      - MANAGER_URL=0.0.0.0
      - RESOURCE_ABSTRACTOR_URL=0.0.0.0
      - REDIS_ADDR=redis://:rootRedis@0.0.0.0:6379

  root_resource_abstractor:
    network_mode: host
    environment:
      - MONGO_URL=0.0.0.0

  jwt_generator:
    network_mode: host
  
  root_addons_manager:
    network_mode: host
    environment:
      - ADDONS_ENGINE_MONGO_URL=0.0.0.0
      - MARKETPLACE_ADDR=http://0.0.0.0:11102
      - JWT_GENERATOR_URL=0.0.0.0

  marketplace_manager:
    network_mode: host
    environment:
      - ADDON_MARKETPLACE_MONGO_URL=0.0.0.0
      - JWT_GENERATOR_URL=0.0.0.0

volumes:
  mongodb_data:
    driver: local
  mongodb_net_data:
    driver: local

networks:
  default:
    name: oakestra
