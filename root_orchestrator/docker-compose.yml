x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-root-log-labels: &root-log-labels
  oakestra.logging.collector: root
  oakestra.cluster.id: root
  logging_jobname: containerlogs

services:

  # System Manager REST API of Root Orchestrator
  system_manager:
    image: system_manager
    build:
      context: system-manager-python/
      additional_contexts:
        # Oakestra shared libraries are built from the repo-local libraries/ folder.
        - libraries=../libraries
    hostname: system_manager
    container_name: system_manager
    labels: *root-log-labels
    expose:
      - "10000"
      - "50052"
    ports:
      - "10000:10000"
      - "50052:50052"
    depends_on:
      - mongo_root
      - root_scheduler
      - root_resource_abstractor
      - root_service_manager
      - jwt_generator
    environment:
      - ROOT_MONGO_URL=mongo
      - LOG_LEVEL=INFO
      - ROOT_MONGO_PORT=10007
      - ROOT_SCHEDULER_URL=root_scheduler
      - ROOT_SCHEDULER_PORT=10004
      - RESOURCE_ABSTRACTOR_URL=root_resource_abstractor
      - RESOURCE_ABSTRACTOR_PORT=11011
      - NET_PLUGIN_URL=root_service_manager
      - NET_PLUGIN_PORT=10099
      - JWT_GENERATOR_URL=jwt_generator
      - JWT_GENERATOR_PORT=10011
    logging: *default-logging

  # MongoDB in Root Orchestrator
  mongo_root:
    image: mongo:8.0
    container_name: mongo
    hostname: mongo
    labels: *root-log-labels
    ports:
      - "10007:10007"
    expose:
      - "10007"
    volumes:
      - 'mongodb_data:/data/db'
    command: mongod --port 10007

  # root-level network mongoDB
  mongo_rootnet:
    image: mongo:8.0
    container_name: mongo_net
    hostname: mongo_net
    labels: *root-log-labels
    ports:
      - "10008:10008"
    volumes:
      - 'mongodb_net_data:/data/db'
    command: mongod --port 10008

  # Root Manager
  root_service_manager:
    image: ghcr.io/oakestra/oakestra-net/root-service-manager:latest
    container_name: root_service_manager
    labels: *root-log-labels
    hostname: root_service_manager
    expose:
      - "10099"
    ports:
      - "10099:10099"
    environment:
      - MY_PORT=10099
      - SYSTEM_MANAGER_URL=system_manager
      - SYSTEM_MANAGER_PORT=10000
      - ROOT_MONGO_URL=mongo_net
      - ROOT_MONGO_PORT=10008
      - JWT_GENERATOR_URL=jwt_generator
      - JWT_GENERATOR_PORT=10011
    depends_on:
      - mongo_rootnet
      - jwt_generator

  # Redis for the Root Scheduler
  root_redis:
    image: redis
    hostname: root_redis
    container_name: root_redis
    labels: *root-log-labels
    ports:
      - "6379:6379"
    command: redis-server --requirepass rootRedis

  # Observability Stack
  grafana:
    image: grafana/grafana
    hostname: grafana
    container_name: grafana
    labels: *root-log-labels
    ports:
      - 3000:3000
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./config/dashboards:/var/lib/grafana/dashboards
    logging: *default-logging

  loki:
    container_name: loki
    image: grafana/loki:2.9.2
    labels: *root-log-labels
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - ./config/loki.yml:/etc/loki/config.yml
      - ./config/alerts/rules.yml:/etc/loki/rules/fake/rules.yml
      - loki_data:/tmp

    command: -config.file=/etc/loki/config.yml
    #logging:
    #  driver: none

  alloy:
    image: grafana/alloy:v1.17.0
    container_name: alloy
    labels: *root-log-labels
    ports:
      - 127.0.0.1:12345:12345
    environment:
      - ALLOY_COLLECTOR_ID=root
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    logging: *default-logging

  dashboard:
    image: ghcr.io/oakestra/dashboard:latest
    ports:
      - '80:80'
    restart: unless-stopped
    container_name: oakestra-frontend-container
    labels: *root-log-labels
    environment:
      - API_ADDRESS=${SYSTEM_MANAGER_URL}:10000

  # Root Scheduler
  root_scheduler:
    image: root_scheduler
    build: ../scheduler/
    container_name: root_scheduler
    labels: *root-log-labels
    hostname: root_scheduler
    expose:
      - "10004"
    ports:
      - "10004:10004"
    environment:
      - ORCHESTRATION_PLANE=root
      - API_PORT=10004
      - MANAGER_URL=system_manager
      - MANAGER_PORT=10000
      - RESOURCE_ABSTRACTOR_URL=root_resource_abstractor
      - RESOURCE_ABSTRACTOR_PORT=11011
      - REDIS_ADDR=redis://:rootRedis@root_redis:6379
    depends_on:
      - root_redis
      - root_resource_abstractor
    logging: *default-logging

  root_resource_abstractor:
    image: resource_abstractor
    build: ../resource-abstractor/
    container_name: root_resource_abstractor
    labels: *root-log-labels
    hostname: root_resource_abstractor
    expose:
      - "11011"
    ports:
      - "11011:11011"
    environment:
      - RESOURCE_ABSTRACTOR_PORT=11011
      - MONGO_URL=mongo
      - MONGO_PORT=10007
    depends_on:
      - mongo_root
    logging: *default-logging

  jwt_generator:
    image: jwt_generator
    build: jwt-generator/
    container_name: jwt_generator
    hostname: jwt_generator
    labels: *root-log-labels
    expose:
      - "10011"
    ports:
      - "10011:10011"
    environment:
      - JWT_GENERATOR_PORT=10011
    logging: *default-logging

  # Addons 
  root_addons_manager:
    image: addons_manager
    container_name: root_addons_manager
    build: ../addons_engine/addons-manager/
    labels: *root-log-labels
    environment:
      - ADDONS_MANAGER_PORT=11101
      - ADDONS_ENGINE_MONGO_URL=mongo
      - ADDONS_ENGINE_MONGO_PORT=10007
      - MARKETPLACE_ADDR=http://marketplace_manager:11102
    ports:
      - 11101:11101
    depends_on:
      - mongo_root
      - marketplace_manager
    logging: *default-logging

  root_addons_monitor:
    image: addons_monitor
    container_name: root_addons_monitor
    build: ../addons_engine/addons-monitor/
    labels: *root-log-labels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ADDONS_MANAGER_ADDR=http://root_addons_manager:11101
      - ORCHESTRATION_PLANE=root
      - DEFAULT_PROJECT_NAME=root_orchestrator
    depends_on:
      - root_addons_manager
    logging: *default-logging
  
  root_addons_dashboard:
    image: addons_dashboard
    container_name: root_addons_dashboard
    build: ../addons_engine/addons-dashboard/
    labels: *root-log-labels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DASHBOARD_PORT=11103
      - MARKETPLACE_URL=marketplace_manager
      - RESOURCE_ABSTRACTOR_URL=root_resource_abstractor
      - ADDONS_ENGINE_URL=root_addons_manager
    depends_on:
      - marketplace_manager
      - root_addons_monitor
      - root_addons_manager
    ports:
      - 11103:11103
    expose:
      - "11103"
    logging: *default-logging

  # Marketplace
  marketplace_manager:
    image: marketplace_manager
    build: ../addons_marketplace/marketplace-manager/
    container_name: marketplace_manager
    labels: *root-log-labels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "11102"
    ports:
      - "11102:11102"
    environment:
      - ADDON_MARKETPLACE_PORT=11102
      - ADDON_MARKETPLACE_MONGO_URL=mongo
      - ADDON_MARKETPLACE_MONGO_PORT=10007
    depends_on:
      - mongo_root
    logging: *default-logging

volumes:
  mongodb_data:
    driver: local
  mongodb_net_data:
    driver: local
  alloy_data:
    driver: local
  loki_data:
    driver: local

networks:
  default:
    name: oakestra
