apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: Loki
    url: http://loki:3100
    version: 2
    editable: true
    isDefault: true
    jsonData:
      derivedFields:
        - name: "Search this ID across local Oakestra logs"
          matcherRegex: '\b([a-fA-F0-9]{24})\b'
          url: '/d/oakestra-logs/oakestra-orchestrator-logs?orgId=1&$${__url_time_range}&var-cluster_id=All&var-source_scope=.%2B&var-compose_service=All&var-level_filter=.%2A&var-search=$${__value.raw}&var-logql_pipeline='
          urlDisplayLabel: "Search this ID across local Oakestra logs"
        - name: "Search this ID in System Manager"
          matcherRegex: '\b([a-fA-F0-9]{24})\b'
          url: '/d/oakestra-logs/oakestra-orchestrator-logs?orgId=1&$${__url_time_range}&var-cluster_id=root&var-source_scope=.%2B&var-compose_service=system_manager&var-level_filter=.%2A&var-search=$${__value.raw}&var-logql_pipeline='
          urlDisplayLabel: "Search this ID in System Manager"
        - name: "Search this ID in Root Scheduler"
          matcherRegex: '\b([a-fA-F0-9]{24})\b'
          url: '/d/oakestra-logs/oakestra-orchestrator-logs?orgId=1&$${__url_time_range}&var-cluster_id=root&var-source_scope=.%2B&var-compose_service=root_scheduler&var-level_filter=.%2A&var-search=$${__value.raw}&var-logql_pipeline='
          urlDisplayLabel: "Search this ID in Root Scheduler"
        - name: "Search this ID in Root Resource Abstractor"
          matcherRegex: '\b([a-fA-F0-9]{24})\b'
          url: '/d/oakestra-logs/oakestra-orchestrator-logs?orgId=1&$${__url_time_range}&var-cluster_id=root&var-source_scope=.%2B&var-compose_service=root_resource_abstractor&var-compose_service=resource_abstractor&var-level_filter=.%2A&var-search=$${__value.raw}&var-logql_pipeline='
          urlDisplayLabel: "Search this ID in Root Resource Abstractor"
        - name: "Search this ID in Root Service Manager"
          matcherRegex: '\b([a-fA-F0-9]{24})\b'
