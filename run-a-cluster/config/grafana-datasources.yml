          url: '/d/oakestra-logs/oakestra-orchestrator-logs?orgId=1&$${__url_time_range}&var-cluster_id=All&var-source_scope=.%2B&var-compose_service=cluster_scheduler&var-level_filter=.%2A&var-search=$${__value.raw}&var-logql_pipeline='
