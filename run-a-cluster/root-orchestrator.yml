x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-root-log-labels: &root-log-labels
  oakestra.logging.collector: root
  oakestra.cluster.id: root
  logging_jobname: containerlogs

services:

  # System Manager REST API of Root Orchestrator
  system_manager:
    image: ghcr.io/oakestra/oakestra/root-system-manager:latest
    hostname: system_manager
    container_name: system_manager
    labels: *root-log-labels
    expose:
      - "10000"
    ports:
      - "10000:10000"
    depends_on:
      - mongo_root
      - root_scheduler
      - root_service_manager
      - jwt_generator
    environment:
      - OAKESTRA_SERVICE_NAME=system_manager
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ROOT_MONGO_URL=mongo
      - ROOT_MONGO_PORT=10007
      - ROOT_SCHEDULER_URL=scheduler
      - ROOT_SCHEDULER_PORT=10004
      - NET_PLUGIN_URL=root_service_manager
      - NET_PLUGIN_PORT=10099
      - JWT_GENERATOR_URL=jwt_generator
      - JWT_GENERATOR_PORT=10011


  # MongoDB in Root Orchestrator
  mongo_root:
    image: mongo:8.0
    container_name: mongo
    hostname: mongo
    labels: *root-log-labels
    ports:
      - "10007:10007"
    expose:
      - "10007"
    volumes:
      - 'mongodb_data:/mongodb'
    command: mongod --port 10007

  # root-level mongoDB
  mongo_rootnet:
    image: mongo:8.0
    container_name: mongo_net
    hostname: mongo_net
    labels: *root-log-labels
    ports:
      - "10008:10008"
    volumes:
      - 'mongodb_net_data:/mongodb'
    command: mongod --port 10008


  # root service manager
  root_service_manager:
    image: ghcr.io/oakestra/oakestra-net/root-service-manager:latest
    container_name: root_service_manager
    hostname: root_service_manager
    labels: *root-log-labels
    expose:
      - "10099"
    ports:
      - "10099:10099"
    environment:
      - MY_PORT=10099
      - SYSTEM_MANAGER_URL=system_manager
      - SYSTEM_MANAGER_PORT=10000
      - ROOT_MONGO_URL=mongo_net
      - ROOT_MONGO_PORT=10008
      - JWT_GENERATOR_URL=jwt_generator
      - JWT_GENERATOR_PORT=10011
    depends_on:
      - mongo_rootnet
      - jwt_generator

  #jwt token generator
  jwt_generator:
    image: ghcr.io/oakestra/oakestra/jwt-generator:latest
    container_name: jwt_generator
    hostname: jwt_generator
    labels: *root-log-labels
    expose:
      - "10011"
    ports:
      - "10011:10011"
    environment:
      - OAKESTRA_SERVICE_NAME=jwt_generator
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_GENERATOR_PORT=10011
    logging: *default-logging

  # Redis for the Root Scheduler
  redis:
    image: redis
    hostname: redis
    container_name: redis
    labels: *root-log-labels
    ports:
      - "6379:6379"
    command: redis-server --requirepass rootRedis

  # Observability Stack
  grafana:
    image: grafana/grafana
    hostname: grafana
    container_name: grafana
    labels: *root-log-labels
    ports:
      - 3000:3000
    environment:
      - OAKESTRA_ALERT_CONTACT_POINT=${OAKESTRA_ALERT_CONTACT_POINT:-Oakestra Alert Webhook}
      - OAKESTRA_ALERT_WEBHOOK_URL=${OAKESTRA_ALERT_WEBHOOK_URL:-http://127.0.0.1:65535/oakestra-alerts}
      - OAKESTRA_ALERT_EMAIL_TO=${OAKESTRA_ALERT_EMAIL_TO:-alerts@example.invalid}
      - GF_SMTP_ENABLED=${OAKESTRA_ALERT_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${OAKESTRA_ALERT_SMTP_HOST:-localhost:25}
      - GF_SMTP_USER=${OAKESTRA_ALERT_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${OAKESTRA_ALERT_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${OAKESTRA_ALERT_SMTP_FROM_ADDRESS:-oakestra-alerts@localhost}
      - GF_SMTP_FROM_NAME=${OAKESTRA_ALERT_SMTP_FROM_NAME:-Oakestra Alerts}
      - GF_SMTP_SKIP_VERIFY=${OAKESTRA_ALERT_SMTP_SKIP_VERIFY:-false}
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./config/alerts/grafana-rules.yml:/etc/grafana/provisioning/alerting/oakestra-rules.yml:ro
      - ./config/alerts/grafana-contact-point.yml:/etc/grafana/provisioning/alerting/oakestra-contact-point.yml:ro
      - ./config/dashboards:/var/lib/grafana/dashboards
    logging: *default-logging

  loki:
    container_name: loki
    image: grafana/loki:2.9.2
    labels: *root-log-labels
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - ./config/loki.yml:/etc/loki/config.yml
      - loki_data:/tmp

    command: -config.file=/etc/loki/config.yml
    #logging:
    #  driver: none

  alloy:
    image: grafana/alloy:v1.17.0
    container_name: alloy
    labels: *root-log-labels
    ports:
      - 127.0.0.1:12345:12345
    environment:
      - ALLOY_COLLECTOR_ID=root
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    logging: *default-logging

  dashboard:
    image: ghcr.io/oakestra/dashboard:latest
    ports:
      - '80:80'
    restart: unless-stopped
    container_name: oaekstra-frontend-container
    labels: *root-log-labels
    environment:
      - API_ADDRESS=${SYSTEM_MANAGER_URL}:10000

  # Root Scheduler
  root_scheduler:
    image: ghcr.io/oakestra/oakestra/scheduler:latest
    container_name: scheduler
    labels: *root-log-labels
    hostname: scheduler
    expose:
      - "10004"
    ports:
      - "10004:10004"
    environment:
      - ORCHESTRATION_PLANE=root
      - MY_PORT=10004
      - SYSTEM_MANAGER_URL=system_manager
      - SYSTEM_MANAGER_PORT=10000
      - RESOURCE_ABSTRACTOR_URL=resource_abstractor
      - RESOURCE_ABSTRACTOR_PORT=11011
      - REDIS_ADDR=redis://:rootRedis@redis:6379
      - ROOT_MONGO_URL=mongo # for compatibility with version 0.4.300
      - ROOT_MONGO_PORT=10007 # for compatibility with version 0.4.300
    depends_on:
      - redis
      - resource_abstractor

  resource_abstractor:
    image: ghcr.io/oakestra/oakestra/resource-abstractor
    container_name: resource_abstractor
    hostname: resource_abstractor
    labels: *root-log-labels
    expose:
      - "11011"
    ports:
      - "11011:11011"
    environment:
      - OAKESTRA_SERVICE_NAME=root_resource_abstractor
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RESOURCE_ABSTRACTOR_PORT=11011
      - ROOT_MONGO_URL=mongo
      - ROOT_MONGO_PORT=10007
    depends_on:
      - mongo_root


networks:
  default:
    name: oakestra

volumes:
  mongodb_data:
    driver: local
  mongodb_net_data:
    driver: local
  alloy_data:
    driver: local
  loki_data:
    driver: local
