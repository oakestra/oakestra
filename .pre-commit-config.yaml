# Installs all hook types when running `pre-commit install`, so post-checkout
# and post-merge hooks also run (needed to regenerate protobuf files after
# switching branches or merging).
default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
default_language_version:
  python: python3
repos:
- repo: local
  hooks:
    - id: generate-protobuf-on-commit
      name: Generate protobuf files (proto changed)
      language: python
      additional_dependencies:
        - grpcio-tools~=1.75.1
      entry: python scripts/generate_protos.py
      stages: [pre-commit]
      files: \.proto$
      pass_filenames: false
    - id: generate-protobuf-on-checkout
      name: Generate protobuf files (after checkout/merge)
      language: python
      additional_dependencies:
        - grpcio-tools~=1.75.1
      entry: python scripts/generate_protos.py
      stages: [post-checkout, post-merge]
      pass_filenames: false
      always_run: true
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.2
  hooks:
    - id: ruff-check
      stages: [pre-commit]
      files: \.py$
