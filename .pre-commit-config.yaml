# Installs all hook types when running `pre-commit install`, so post-checkout
# and post-merge hooks also run (needed to regenerate protobuf files after
# switching branches or merging).
default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
default_language_version:
  python: python3
repos:
- repo: local
  hooks:
    - id: generate-protobuf-on-commit
      name: Generate protobuf files (proto changed)
      language: python
      additional_dependencies:
        - grpcio-tools~=1.75.1
      entry: python scripts/generate_protos.py
      stages: [pre-commit]
      files: \.proto$
      pass_filenames: false
    - id: generate-protobuf-on-checkout
      name: Generate protobuf files (after checkout/merge)
      language: python
      additional_dependencies:
        - grpcio-tools~=1.75.1
      entry: python scripts/generate_protos.py
      stages: [post-checkout, post-merge]
      pass_filenames: false
      always_run: true
    # Unlike protobuf above, these need no wrapper script: the generator
    # version and output paths live in each module's own go:generate
    # directive, so a hook is one go invocation. Add one entry per generation
    # target - note that the two below share a spec, generating the server
    # and the client from the same file, so both have to run when it changes.
    #
    # There is also no post-checkout/post-merge counterpart, because the
    # generated OpenAPI code is committed: a checkout already brings the
    # version matching the spec it came from. Only editing the spec can put
    # the two out of step, which is what this catches - and it fails the
    # commit if the regenerated code differs, so the result has to be staged
    # rather than silently diverging from CI.
    - id: generate-openapi-resource-abstractor
      name: Generate OpenAPI server code (go_resource_abstractor spec changed)
      language: system
      entry: go generate -C go_resource_abstractor ./openapi
      stages: [pre-commit]
      files: ^go_resource_abstractor/openapi/.*\.yaml$
      pass_filenames: false
    - id: generate-openapi-resource-abstractor-client
      name: Generate OpenAPI client code (go_resource_abstractor spec changed)
      language: system
      entry: go generate -C go_resource_abstractor/client ./openapi
      stages: [pre-commit]
      files: ^go_resource_abstractor/openapi/.*\.yaml$
      pass_filenames: false
    # Third generation target reading the same spec: the Python client's transport
    # layer (libraries/resource_abstractor_client/resource_abstractor_client/openapi/).
    # Each pre-commit hook runs in its own isolated environment, so ruff has to be
    # listed here too - it's openapi-python-client's own post-generation formatting
    # step (see libraries/resource_abstractor_client/openapi/config.yaml), run as a
    # subprocess that needs a `ruff` executable on PATH, not just importable.
    - id: generate-openapi-resource-abstractor-client-python
      name: Generate Python resource abstractor client (go_resource_abstractor spec changed)
      language: python
      additional_dependencies:
        - openapi-python-client==0.29.0
        - ruff==0.15.22
      entry: python scripts/generate_python_client.py
      stages: [pre-commit]
      files: ^go_resource_abstractor/openapi/.*\.yaml$
      pass_filenames: false
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.22
  hooks:
    - id: ruff-check
      stages: [pre-commit]
      files: \.py$
    - id: ruff-format
      stages: [pre-commit]
      files: \.py$
      args: [--check]
