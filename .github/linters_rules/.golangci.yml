version: "2"

run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 2
  tests: true

output:
  formats:
    text:
      print-issued-lines: false
      print-linter-name: true
  sort-order:
    - file
    - linter

linters:
  default: none

  # Full linter list: https://golangci-lint.run/docs/linters/
  # In v2, staticcheck also covers the former gosimple and stylecheck checks.
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - tagalign
    - unconvert
    - unparam
    #- revive
    #- whitespace
    #- wsl
    #- ineffassign
    #- gosec
    #- dupl
    #- goconst
    #- tagliatelle

  settings:
    revive:
      # Only these rules are enabled.
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
    #- gofmt
