version: "2"

run:
  concurrency: 4
  issues-exit-code: 2
  tests: true

output:
  sort-order:
    - file
    - linter

linters:
  default: none

  # Full linter list: https://golangci-lint.run/docs/linters/
  # In v2 staticcheck also covers the old gosimple and stylecheck checks.
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - tagalign
    - unconvert
    - unparam
    #- revive
    #- whitespace
    #- wsl
    #- ineffassign
    #- gosec
    #- dupl
    #- goconst
    #- tagliatelle

  settings:
    errcheck:
      # A failed write to stdout or stderr in a CLI has nowhere better to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      # Only these rules are enabled.
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
    #- gofmt
