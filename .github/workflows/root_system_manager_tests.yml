name: Root System Manager Test

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate protobuf files
        working-directory: root_orchestrator/system-manager-python
        run: |
          uv run --no-sync -m grpc_tools.protoc \
            -Isrc \
            --python_out=src \
            --grpc_python_out=src \
            --pyi_out=src \
            src/system_manager/proto/cluster_registration.proto

      - name: Build Docker images
        working-directory: resource-abstractor
        run: |
          docker build -t resource_abstractor:test .

      - name: Run containers
        working-directory: root_orchestrator/
        run: |
          docker compose up root_resource_abstractor -d

      - name: Run test suite
        working-directory: root_orchestrator/system-manager-python
        run: |
          uv run --with pytest pytest