name: Root System Manager Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --package system-manager

      - name: Generate protobuf files
        working-directory: root_orchestrator/system-manager-python
        run: |
          uv run --no-sync -m grpc_tools.protoc \
            -Isrc \
            --python_out=src \
            --grpc_python_out=src \
            --pyi_out=src \
            src/system_manager/proto/cluster_registration.proto

      - name: Build Docker images
        working-directory: resource-abstractor
        run: |
          docker build --build-context libraries=../libraries -t resource_abstractor .

      - name: Run containers
        working-directory: root_orchestrator/
        run: |
          docker compose up root_resource_abstractor -d --no-build

      - name: Run test suite
        working-directory: root_orchestrator/system-manager-python
        run: |
          uv run --no-sync --with pytest --with coverage coverage run -m pytest

      - name: Generate report
        working-directory: root_orchestrator/system-manager-python
        run: |
          uv run --no-sync --with coverage coverage html -d tests/coverage
