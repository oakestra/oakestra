name: Root System Manager Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install pytest
        working-directory: root_orchestrator/system-manager-python
        run: |
          pip install pytest coverage

      - name: Install dependencies
        working-directory: root_orchestrator/system-manager-python
        run: |
          pip install -r requirements.txt --no-cache-dir

      - name: Install local Oakestra libraries
        working-directory: root_orchestrator/system-manager-python
        run: |
          pip install --no-cache-dir ../../libraries/resource_abstractor_client ../../libraries/oakestra_utils_library

      - name: Generate protobuf files
        working-directory: root_orchestrator/system-manager-python
        run: |
          python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. proto/clusterRegistration.proto

      - name: Build Docker images
        working-directory: resource-abstractor
        run: |
          docker build -t resource_abstractor:test .

      - name: Run containers
        working-directory: root_orchestrator/
        # The compose file keeps the abstractor off the host on purpose, but the tests run on
        # the runner and call it at localhost:11011, so publish it on loopback for CI only.
        run: |
          cat > "$RUNNER_TEMP/ci-publish-abstractor.yml" <<'EOF'
          services:
            root_resource_abstractor:
              ports:
                - "127.0.0.1:11011:11011"
          EOF
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-publish-abstractor.yml" up root_resource_abstractor -d

      - name: Run test suite
        working-directory: root_orchestrator/system-manager-python
        run: |
          coverage run -m pytest

      - name: Generate report
        working-directory: root_orchestrator/system-manager-python
        run: |
          coverage html -d tests/coverage