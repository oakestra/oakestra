name: Python Codestyle Check (ruff)

on: pull_request

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff formating check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.15.22
          args: format --check
      - name: Run ruff linting check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.15.22
          args: check
