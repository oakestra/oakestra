name: Cluster Service Manager Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install pytest
        working-directory: cluster_orchestrator/service-manager
        run: |
          pip install pytest

      - name: Install dependencies
        working-directory: cluster_orchestrator/service-manager
        run: |
          pip install -r requirements.txt

      - name: Run test suite
        working-directory: cluster_orchestrator/service-manager
        run: |
           pytest
