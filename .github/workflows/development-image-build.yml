name: Docker Build images during PR development

on:
  pull_request:
    branches:
      - develop  
    paths:
      - 'root_orchestrator/system-manager-python/Dockerfile'
      - 'root_orchestrator/system-manager-python/pyproject.toml'
      - 'cluster_orchestrator/cluster-manager/Dockerfile'
      - 'cluster_orchestrator/cluster-manager/pyproject.toml'
      - 'libraries/resource-abstractor-client/pyproject.toml'
      - 'libraries/oakestra-utils/pyproject.toml'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  gather-modified-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.folders.outputs.value }}
    steps:
      - name: Run
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Get all matching changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          since_last_remote_commit: true 
          files: |
            root_orchestrator/system-manager-python/Dockerfile
            root_orchestrator/system-manager-python/pyproject.toml
            cluster_orchestrator/cluster-manager/Dockerfile
            cluster_orchestrator/cluster-manager/pyproject.toml
            libraries/resource-abstractor-client/pyproject.toml
            libraries/oakestra-utils/pyproject.toml
            pyproject.toml
            uv.lock

      - name: Run step if matching changed files are detected
        id: folders
        env:
          DETECTED_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          echo "Changed files detected: $DETECTED_CHANGED_FILES"
          readarray -d ' ' -t context_array <<< "$DETECTED_CHANGED_FILES"
          
          value=()
          for element in "${context_array[@]}"; do
            element=$(echo "$element" | tr -d '[:space:]')
            element="${element#./}"
            [ -z "$element" ] && continue

            if [[ "$element" == libraries/* ]] || [[ "$element" == "pyproject.toml" ]] || [[ "$element" == "uv.lock" ]]; then
              value+=("root_orchestrator/system-manager-python")
              value+=("cluster_orchestrator/cluster-manager")
            elif [[ "$element" == */Dockerfile ]] || [[ "$element" == */pyproject.toml ]]; then
              dir="$(dirname "$element")"
              if [ -f "$dir/Dockerfile" ]; then
                value+=("$dir")
              fi
            fi
          done
          
          # Deduplicate array and format as JSON
          if [ ${#value[@]} -eq 0 ]; then
            echo 'value=[]' >> "$GITHUB_OUTPUT"
          else
            output=$(printf '%s\n' "${value[@]}" | sort -u | jq -R . | jq -s -c .)
            echo "value=$output" >> "$GITHUB_OUTPUT"
          fi
                  
  ### Dynamic matrix for spawning multiple build jobs
  build:
    needs: [ gather-modified-files ]
    if: ${{ needs.gather-modified-files.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    env:
        # Use docker.io for Docker Hub if empty
        REGISTRY: ghcr.io
        # github.repository as <account>/<repo>
        IMAGE_NAME: ${{ github.repository }}/${{ matrix.value }}
    permissions:
        contents: read
        packages: write
        id-token: write
    strategy:
      matrix:
        value: ${{fromJSON(needs.gather-modified-files.outputs.matrix)}}
    steps:      
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{!startsWith(github.ref, 'refs/tags/alpha')}}
  
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
            image: tonistiigi/binfmt:latest
            platforms: all
    
      - name: Determine Docker build context
        id: build-config
        run: |
          if [ "${{ matrix.value }}" = "root_orchestrator/system-manager-python" ] || [ "${{ matrix.value }}" = "cluster_orchestrator/cluster-manager" ]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "file=./${{ matrix.value }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=./${{ matrix.value }}/" >> $GITHUB_OUTPUT
            echo "file=./${{ matrix.value }}/Dockerfile" >> $GITHUB_OUTPUT
          fi

    # Build Docker image with Buildx (matching file push on same PR)
      - name: Build Docker image (push disabled)
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
            context: ${{ steps.build-config.outputs.context }}
            file: ${{ steps.build-config.outputs.file }}
            platforms: linux/amd64
            push: false
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
