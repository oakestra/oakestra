name: Testbed Oneshot - Intermediate Approval Check

# Only used as the trigger for `oneshot_testbed_workflow_run.yml`, which listens for this
# workflow by name, so don't rename it.
# Fork PRs can edit this file, so don't put secrets or checks in here. The approval is checked
# in `oneshot_testbed_workflow_run.yml`.

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  trigger:
    name: Request Testbed Oneshot Execution
    if: ${{ github.event.review.state == 'approved' }}
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: echo "Testbed result will show up as the 'testbed/oneshot' status on the PR."
