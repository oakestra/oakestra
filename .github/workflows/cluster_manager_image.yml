name: Docker cluster-manager-python

on:
  push:
    tags:
      - 'v*.*.*'
      - 'alpha-v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: oakestra/.github/.github/workflows/docker-build-push.yml@v1
    with:
      image_name: cluster-manager
      context: ./cluster_orchestrator/cluster-manager/
      # Oakestra shared libraries are built from the repo-local libraries/ folder.
      build_contexts: |
        libraries=./libraries
    secrets: inherit
