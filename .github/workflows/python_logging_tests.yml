name: Python Structured Logging Tests

on:
  pull_request:
    paths:
      - "libraries/oakestra_logging/**"
      - ".github/workflows/python_logging_tests.yml"
  push:
    branches:
      - develop
    paths:
      - "libraries/oakestra_logging/**"
      - ".github/workflows/python_logging_tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: libraries/oakestra_logging/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e 'libraries/oakestra_logging[test]'

      - name: Run logging contract tests
        run: pytest -q libraries/oakestra_logging/tests
