name: Golang node enigne artifacts

on:
  push:
    tags:
      - 'v*.*.*'
      - 'alpha-v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      # setup-go >= v6 sets GOTOOLCHAIN=local, so the installed Go must satisfy
      # go.mod on its own instead of auto-downloading a newer toolchain.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go_node_engine/go.mod
          cache-dependency-path: go_node_engine/go.sum

      - name: Build NodeEngine ({{ matrix.architecture }})
        run: |
          cd go_node_engine
          env GOOS=linux GOARCH=${{ matrix.architecture }} CGO_ENABLED=0  go build -ldflags="-X 'go_node_engine/cmd.Version=${{ github.ref_name }}'" -o ../NodeEngine NodeEngine.go
          env GOOS=linux GOARCH=${{ matrix.architecture }} CGO_ENABLED=0 go build -o ../nodeengined internal/daemon/nodeengined.go

      - name: Package Artifacts
        run: |
          mkdir -p NodeEngine_folder_${{ matrix.architecture }}
          cp NodeEngine nodeengined go_node_engine/build/install.sh go_node_engine/build/configure-gpu.sh go_node_engine/nodeengine.service go_node_engine/oakestra.logrotate NodeEngine_folder_${{ matrix.architecture }}
          tar -czvf NodeEngine_${{ matrix.architecture }}.tar.gz -C NodeEngine_folder_${{ matrix.architecture }} .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NodeEngine_${{ matrix.architecture }}
          path: NodeEngine_${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  # Don't use softprops/action-gh-release here: on an existing release it
  # appends the generated notes again on every call, even without append_body.
  # See softprops/action-gh-release#827 (fix proposed in #844, not released yet).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Alpha tags get force-pushed on every develop merge, so runs can overlap.
    concurrency:
      group: node-engine-release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      # GITHUB_TOKEN wouldn't trigger update_version_file.yml on publish.
      GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: NodeEngine_*
          merge-multiple: true

      - name: Release Artifacts
        run: |
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" NodeEngine_*.tar.gz --clobber
            # Stable notes are often edited by hand, so only alphas get overwritten.
            if [[ "$TAG" == alpha-* ]]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" NodeEngine_*.tar.gz \
              --verify-tag --prerelease --notes-file notes.md
          fi


