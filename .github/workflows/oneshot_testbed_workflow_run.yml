name: Testbed Oneshot - Multiple Scenarios Test Deployment

# Starts the testbed (`oneshot_testbed_deploy.yml`) when a maintainer approves a PR.
# `oneshot_testbed_approval.yml` only acts as the trigger, because workflows started by a review
# on a fork PR don't get secrets.
# This gets triggered for every review, not only approvals, and a fork PR can modify the
# approval workflow. That's why the approval is checked again here via the API.
# To re-run the testbed without re-approving, start `oneshot_testbed_deploy.yml` manually.

on:
  workflow_run:
    workflows: ["Testbed Oneshot - Intermediate Approval Check"]
    types:
      - requested

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  authorize:
    name: Verify maintainer approval
    # A fork PR could add a workflow with the same name but a different trigger
    if: github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Verify maintainer approval
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"

          # workflow_run.pull_requests is empty for fork PRs.
          # Not `head -n1`: it closes the pipe early, gh gets SIGPIPE on the next page and
          # pipefail fails the step.
          pr_number=$(gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.sha == \"${HEAD_SHA}\" and .head.repo.full_name == \"${HEAD_REPO}\") | .number" \
            | sed -n 1p)
          if [ -z "$pr_number" ]; then
            echo "No open PR with head ${HEAD_REPO}@${HEAD_SHA}; nothing to do."
            exit 0
          fi

          # The event doesn't say which review triggered us, so take the latest one from before
          # this run was created (10s slack for clock skew). Later reviews have their own run,
          # and a comment right after an approval would otherwise hide it.
          latest=$(gh api --paginate "repos/${REPO}/pulls/${pr_number}/reviews?per_page=100" \
            --jq '.[] | {user: .user.login, state, commit_id, submitted_at}' \
            | jq -s --arg created "$RUN_CREATED_AT" '
                ($created | fromdateiso8601) as $t
                | map(select(.submitted_at != null)
                      | .age = ($t - (.submitted_at | fromdateiso8601))
                      | select(.age >= -10))
                | last // empty')
          state=$(jq -r '.state // empty' <<<"$latest")
          reviewer=$(jq -r '.user // empty' <<<"$latest")
          commit_id=$(jq -r '.commit_id // empty' <<<"$latest")
          age=$(jq -r '.age // empty' <<<"$latest")

          if [ "$state" != "APPROVED" ]; then
            echo "Latest review on PR #${pr_number} is '${state:-none}', not an approval; skipping."
            exit 0
          fi
          # The fork controls the trigger workflow and can make it fire on `edited` too. Editing
          # an older review leaves the approval as the latest one, so without an age limit the
          # author could re-run the testbed forever off a single approval.
          if [ "${age%.*}" -gt 600 ]; then
            echo "Approval by ${reviewer} was submitted ${age}s before this run, not a new approval; skipping."
            exit 0
          fi
          # Approval has to be for the current commit
          if [ "$commit_id" != "$HEAD_SHA" ]; then
            echo "Approval by ${reviewer} is for ${commit_id}, PR head is ${HEAD_SHA}; skipping."
            exit 0
          fi

          # Anyone can approve a public PR, so check the reviewer has write access
          # (`permission` reports maintain as write)
          permission=$(gh api "repos/${REPO}/collaborators/${reviewer}/permission" --jq '.permission' || echo none)
          case "$permission" in
            admin|write) ;;
            *)
              echo "Reviewer ${reviewer} has '${permission}' access, not write; skipping."
              exit 0
              ;;
          esac

          echo "PR #${pr_number} approved by ${reviewer} at ${HEAD_SHA}."
          {
            echo "approved=true"
            echo "pr_number=${pr_number}"
            echo "head_sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Testbed
    needs: authorize
    if: needs.authorize.outputs.approved == 'true'
    uses: ./.github/workflows/oneshot_testbed_deploy.yml
    with:
      pr_number: ${{ fromJSON(needs.authorize.outputs.pr_number) }}
      head_sha: ${{ needs.authorize.outputs.head_sha }}
    secrets:
      TOWER_HOST: ${{ secrets.TOWER_HOST }}
      TOWER_TOKEN: ${{ secrets.TOWER_TOKEN }}
